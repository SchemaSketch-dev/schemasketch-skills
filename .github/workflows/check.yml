name: check

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily: catches MCP server changes the skill doesn't cover yet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontmatter, versions, tools match the live server, links
        run: python3 scripts/check.py

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the Claude Code plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
