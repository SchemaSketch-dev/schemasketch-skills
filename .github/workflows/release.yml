name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the plugin version and is one step above the last
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          [ "$tag" = "$version" ] || { echo "Tag v$tag but plugin.json says $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tags are only made on main"; exit 1; }
          prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "v$tag" | head -n1)
          if [ -n "$prev" ]; then
            IFS=. read -r a b c <<<"${prev#v}"
            case "$tag" in
              "$a.$b.$((c+1))"|"$a.$((b+1)).0"|"$((a+1)).0.0") ;;
              *) echo "v$tag is not one step above $prev"; exit 1 ;;
            esac
          fi
      - name: Checks
        run: python3 scripts/check.py
      - name: Publish the release with its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## "v" \\(" {f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$tag" --notes-file notes.md --verify-tag
